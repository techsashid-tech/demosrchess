<style>

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:.86rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--bd);cursor:pointer;transition:.3s var(--ease);position:relative;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--card);min-height:48px;backdrop-filter:blur(10px);text-shadow:0 0 10px rgba(255,255,255,.35)}

.btn.pri{background:linear-gradient(180deg,var(--red1),var(--red2));color:#fff;border-color:transparent;box-shadow:0 5px 0 #7d1228,0 14px 30px rgba(226,58,82,.4)}
.btn.blue{background:linear-gradient(180deg,var(--blue1),var(--blue2));color:#fff;border-color:transparent;box-shadow:0 5px 0 #1d2e8a,0 14px 30px rgba(74,104,240,.4)}
.btn.wa{background:linear-gradient(180deg,#2fd272,#15a653);color:#fff;border-color:transparent;box-shadow:0 5px 0 #0c6f37,0 14px 30px rgba(52,210,123,.35)}

.btn.blue:hover{background:linear-gradient(180deg,#e85a70,var(--red2));box-shadow:0 7px 0 #7d1228,0 0 38px rgba(255,70,100,.8)}
.btn.wa:hover{background:linear-gradient(180deg,#e85a70,var(--red2));box-shadow:0 7px 0 #7d1228,0 0 38px rgba(255,70,100,.8)}

.mega{font-size:1.1rem;padding:20px 40px;min-height:64px;animation:zoomPulse 2.2s ease-in-out infinite;box-shadow:0 6px 0 #7d1228,0 0 40px rgba(255,70,100,.7),0 0 80px rgba(226,58,82,.35)}

/* Floating & Blinking Light Pill */
.chip{display:inline-flex;align-items:center;gap:11px;padding:10px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(14,18,34,.75);font-size:.94rem;font-weight:500;letter-spacing:.02em;margin-bottom:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden}
[data-theme=light] .chip{background:rgba(255,255,255,.88);border-color:rgba(226,58,82,.35);color:#10132a}
.chip-hero{
  border-color:rgba(245,197,66,.55);
  box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 22px rgba(245,197,66,.35),inset 0 0 14px rgba(255,255,255,.08);
  animation:chipFloat 4.2s ease-in-out infinite,chipBlinkGlow 2.4s ease-in-out infinite alternate;
}
.chip-hero::after{
  content:"";
  position:absolute;
  top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(110deg,transparent,rgba(255,240,180,.42),transparent);
  transform:skewX(-22deg);
  animation:chipSweep 3.4s ease-in-out infinite;
  pointer-events:none;
}
.chip-txt{
  background:linear-gradient(90deg,#ffffff 0%,#fff3c4 45%,#ffd24f 75%,#ffffff 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  font-weight:600;
  animation:chipTextShimmer 4s linear infinite;
}
[data-theme=light] .chip-txt{
  background:linear-gradient(90deg,#10132a 0%,#a8730a 50%,#b81d3a 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green),0 0 22px var(--green);animation:dotBlink 1.3s ease-in-out infinite}
.chip svg{width:19px;height:19px;stroke:var(--green);fill:none;stroke-width:2.2;filter:drop-shadow(0 0 6px rgba(52,210,123,.75));flex:none}
@keyframes chipFloat{0%,100%{transform:translateY(0px) rotate(0deg)}50%{transform:translateY(-8px) rotate(.4deg)}}
@keyframes chipBlinkGlow{0%{border-color:rgba(255,255,255,.22);box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 10px rgba(52,210,123,.2)}50%{border-color:rgba(245,197,66,.85);box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 28px rgba(245,197,66,.6),0 0 46px rgba(226,58,82,.35)}100%{border-color:rgba(52,210,123,.85);box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 26px rgba(52,210,123,.55),0 0 44px rgba(74,104,240,.35)}}

.ring{

  height:var(--h);

.ci{
  position:absolute;
  inset:0;
  border-radius:22px;
  border:1.5px solid rgba(255,255,255,.24);
  background:linear-gradient(165deg,rgba(255,255,255,.14) 0%,rgba(62,54,72,.45) 45%,rgba(112,84,48,.52) 100%);

  box-shadow:0 24px 52px rgba(0,0,0,.58),inset 0 1px 1px rgba(255,255,255,.35),inset 0 -26px 46px rgba(245,197,66,.16);
  overflow:hidden;
  cursor:pointer;
  transition:border-color .35s,box-shadow .35s,transform .35s;
}
.ci::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:22px;
  background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,transparent 45%,rgba(245,197,66,.12) 100%);

  z-index:1;

  z-index:2;

  height:32px;
  border-radius:50%;
  background:rgba(10,12,26,.76);
  border:1px solid rgba(245,197,66,.65);

  place-items:center;

  justify-content:center;

  font-weight:700;

let AC=null,SND=localStorage.getItem("src-snd")!=="off";
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,vol,slide){if(!SND)return;const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
const SFX={hover:()=>tone(900,.05,"sine",.02),click:()=>tone(540,.09,"triangle",.07,260),move:()=>{tone(150,.14,"square",.05,70);setTimeout(()=>tone(320,.06,"triangle",.05),35)},ok:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.16,"sine",.07),i*90)),tab:()=>tone(700,.08,"triangle",.06,1000)};

/* TYPEWRITER TAGLINE EFFECT */
function tagline(){
 const list=[
  "“Learn. Think. Compete. Conquer.”",
  "“Think Beyond the Board”",
  "“Where Strategy Meets Excellence”",
  "“Building Tomorrow's Chess Champions”",
  "“Every Great Champion Starts With a Move”"
 ];
 const el=$("#tag");if(!el)return;
 let idx=0,charIdx=0,deleting=false,stopped=false,to;
 function step(){
  if(stopped)return;
  const full=list[idx];
  if(!deleting){
   charIdx++;
   el.textContent=full.slice(0,charIdx);
   if(charIdx>=full.length){
    deleting=true;
    to=setTimeout(step,2300);
    return;
   }
   to=setTimeout(step,58);
  }else{
   charIdx--;
   el.textContent=full.slice(0,charIdx);
   if(charIdx<=0){
    deleting=false;
    idx=(idx+1)%list.length;
    to=setTimeout(step,320);
    return;
   }
   to=setTimeout(step,30);
  }
 }
 if(RM){el.textContent=list[0];return;}
 step();
 cleanups.push(()=>{stopped=true;clearTimeout(to)});
}

/* PREMIERE FREE CHESS TOOLS ENGINE */
function initTools(){
 const tbox=$("#tbox"),tabs=document.querySelectorAll(".ttab");if(!tbox)return;
 let clockInt=null,toolCleanup=()=>{};
 const fmt=s=>{const m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`};

 function fenBoard(fen,lightCol="#f0d9b5",darkCol="#b58863"){
  const rows=fen.split(" ")[0].split("/");
  const map={K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
  let h="";
  rows.forEach((r,ri)=>{
   let ci=0;
   for(const ch of r){
    if(/\d/.test(ch)){
     for(let k=0;k<+ch;k++){
      const bg=(ri+ci)%2===0?lightCol:darkCol;
      h+=`<div class="msq" style="background:${bg}"></div>`;
      ci++;
     }
    }else{
     const bg=(ri+ci)%2===0?lightCol:darkCol;
     const isW=ch===ch.toUpperCase();
     h+=`<div class="msq" style="background:${bg};color:${isW?"#fff":"#111528"};text-shadow:${isW?"0 1px 3px rgba(0,0,0,.85)":"none"}">${map[ch]+VS}</div>`;
     ci++;
    }
   }
  });
  return `<div class="mini-board">${h}</div>`;
 }

 const views={
  clock(){
   let base=300,inc=0,w=300,b=300,turn="w",running=false,mode="BLITZ";
   const draw=()=>{
    tbox.innerHTML=`
    <div class="tbox-head">
     <div><h3>🕒 TOURNAMENT DIGITAL CHESS CLOCK</h3><p>Click either clock face to switch turn and start counting down</p></div>
     <div class="mode-pills">${[["BULLET",60,0],["BLITZ",300,0],["RAPID",600,5],["CLASSICAL",1800,10]].map(m=>`<button class="mpill${mode===m[0]?" on":""}" data-m="${m[0]}" data-s="${m[1]}" data-i="${m[2]}">${m[0]}</button>`).join("")}</div>
    </div>
    <div class="clk-grid">
     <div class="clk-face${running&&turn==="w"?" active":""}${w===0?" flag":""}" id="cf-w">
      <div class="clk-lbl">WHITE PLAYER</div>
      <div class="clk-time" id="ct-w">${fmt(w)}</div>
      <div class="clk-sub">${w===0?"Time Flagged!":"Tap to pass turn"}</div>
     </div>
     <div class="clk-face${running&&turn==="b"?" active":""}${b===0?" flag":""}" id="cf-b">
      <div class="clk-lbl">BLACK PLAYER</div>
      <div class="clk-time" id="ct-b">${fmt(b)}</div>
      <div class="clk-sub">${b===0?"Time Flagged!":"Tap to pass turn"}</div>
     </div>
    </div>
    <div class="row" style="justify-content:center;margin-top:26px">
     <button class="btn" id="clk-toggle">${running?"⏸ Pause Clock":"▷ Start Clock"}</button>
     <button class="btn" id="clk-reset">↻ Reset</button>
    </div>`;
    tbox.querySelectorAll(".mpill").forEach(btn=>btn.onclick=()=>{
     clearInterval(clockInt);running=false;mode=btn.dataset.m;base=+btn.dataset.s;inc=+btn.dataset.i;w=base;b=base;turn="w";draw();
    });
    $("#cf-w").onclick=()=>{if(w===0||b===0)return;if(!running)running=true;else if(turn==="w")w+=inc;turn="b";startLoop();draw()};
    $("#cf-b").onclick=()=>{if(w===0||b===0)return;if(!running)running=true;else if(turn==="b")b+=inc;turn="w";startLoop();draw()};
    $("#clk-toggle").onclick=()=>{if(w===0||b===0)return;running=!running;if(running)startLoop();else clearInterval(clockInt);draw()};
    $("#clk-reset").onclick=()=>{clearInterval(clockInt);running=false;w=base;b=base;turn="w";draw()};
   };
   function startLoop(){
    clearInterval(clockInt);
    clockInt=setInterval(()=>{
     if(!running)return;
     if(turn==="w"){if(w>0)w--;else{running=false;clearInterval(clockInt);draw();return}}
     else{if(b>0)b--;else{running=false;clearInterval(clockInt);draw();return}}
     const ew=$("#ct-w"),eb=$("#ct-b");
     if(ew)ew.textContent=fmt(w);if(eb)eb.textContent=fmt(b);
     if(w===0||b===0){running=false;clearInterval(clockInt);draw()}
    },1000);
   }
   draw();
   toolCleanup=()=>clearInterval(clockInt);
  },

    <div><small style="color:var(--mu)">RATING CHANGE</small><h3 id="elo-chg" style="font-size:1.8rem;color:var(--green);margin-top:4px">+13.6</h3></div>
    <div><small style="color:var(--mu)">NEW ESTIMATED RATING</small><h3 id="elo-new" style="font-size:1.8rem;color:var(--gold);margin-top:4px">1564</h3></div>

   const calc=()=>{
    const r=+$("#elo-r").value||1200,o=+$("#elo-o").value||1200,s=+$("#elo-s").value,k=+$("#elo-k").value;
    const exp=1/(1+Math.pow(10,(o-r)/400));

    $("#elo-new").textContent=Math.round(r+diff);
   };

   calc();
  },

function board3d(){
 const b=$("#b3"),w=$("#b3wrap");if(!b)return;let a=20,drag=null,hov=false,last=performance.now(),id;
 w.addEventListener("pointerdown",e=>{drag=e.clientX;try{w.setPointerCapture(e.pointerId)}catch(_){}});
 w.addEventListener("pointermove",e=>{if(drag!==null){a+=(e.clientX-drag)*.6;drag=e.clientX}});
 w.addEventListener("pointerup",()=>drag=null);w.addEventListener("pointercancel",()=>drag=null);
 w.addEventListener("mouseenter",()=>hov=true);w.addEventListener("mouseleave",()=>hov=false);
 function f(n){const dt=Math.min((n-last)/1000,.1);last=n;if(drag===null&&!RM)a+=dt*(hov?5:14);b.style.setProperty("--a",a+"deg");id=requestAnimationFrame(f)}
 id=requestAnimationFrame(f);cleanups.push(()=>cancelAnimationFrame(id));
}
function dither(){
 const box=$("#dv");if(!box)return;const cv=$("#dvc"),cx=cv.getContext("2d");
 const PX=2,R=200,SOFT=.6,INK=[18,15,23],PAPER=[244,241,234];
 let W,H,dc,mk,mc,raf,bursts=[],ptr={x:0,y:0,t:0,in:false},t0=performance.now();
 function build(){
  W=cv.width=box.clientWidth;H=cv.height=box.clientHeight;
  const sw=Math.ceil(W/PX),sh=Math.ceil(H/PX);
  const s=document.createElement("canvas");s.width=sw;s.height=sh;const g=s.getContext("2d");
  const bg=g.createRadialGradient(sw/2,sh*.45,sh*.1,sw/2,sh/2,sh*.95);bg.addColorStop(0,"#f4f4f4");bg.addColorStop(1,"#8c8c8c");g.fillStyle=bg;g.fillRect(0,0,sw,sh);
  g.textAlign="center";g.textBaseline="middle";g.font=Math.floor(sh*.95)+"px 'Segoe UI Symbol','Noto Sans Symbols 2','Apple Symbols','DejaVu Sans',serif";
  const lg=g.createLinearGradient(sw*.35,0,sw*.65,sh);lg.addColorStop(0,"#9c9c9c");lg.addColorStop(.5,"#383838");lg.addColorStop(1,"#0e0e0e");
  g.shadowColor="rgba(0,0,0,.5)";g.shadowBlur=sh*.04;g.fillStyle=lg;g.fillText("\u265E\uFE0E",sw/2,sh*.52);
  const im=g.getImageData(0,0,sw,sh),d=im.data,Lm=new Float32Array(sw*sh);
  for(let i=0;i<Lm.length;i++){let v=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;Lm[i]=((v/255-.5)*1.15+.5)*255}
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=y*sw+x,o=Lm[i],n=o<128?0:255,e=o-n;Lm[i]=n;
   if(x+1<sw)Lm[i+1]+=e*7/16;if(y+1<sh){if(x>0)Lm[i+sw-1]+=e*3/16;Lm[i+sw]+=e*5/16;if(x+1<sw)Lm[i+sw+1]+=e/16}}
  const out=g.createImageData(sw,sh),od=out.data;
  for(let i=0;i<Lm.length;i++){const c=Lm[i]<128?INK:PAPER;od[i*4]=c[0];od[i*4+1]=c[1];od[i*4+2]=c[2];od[i*4+3]=255}
  dc=document.createElement("canvas");dc.width=sw;dc.height=sh;dc.getContext("2d").putImageData(out,0,0);
  mk=document.createElement("canvas");mk.width=W;mk.height=H;mc=mk.getContext("2d");
 }
 function spot(x,y,r,a){const gr=mc.createRadialGradient(x,y,r*(1-SOFT),x,y,r);gr.addColorStop(0,"rgba(0,0,0,"+a+")");gr.addColorStop(1,"rgba(0,0,0,0)");mc.fillStyle=gr;mc.beginPath();mc.arc(x,y,r,0,7);mc.fill()}
 function frame(now){
  mc.globalCompositeOperation="destination-out";mc.fillStyle="rgba(0,0,0,.04)";mc.fillRect(0,0,W,H);mc.globalCompositeOperation="source-over";
  let x=ptr.x,y=ptr.y;
  if(!ptr.in||now-ptr.t>2500){const t=(now-t0)/1000;x=W/2+Math.sin(t*.9)*W*.3;y=H/2+Math.sin(t*1.3+1)*H*.26}
  spot(x,y,R,.55);
  bursts=bursts.filter(b=>now-b.t<700);bursts.forEach(b=>{const k=(now-b.t)/700;spot(b.x,b.y,R*(.6+1.8*k),.4*(1-k))});
  cx.globalCompositeOperation="source-over";cx.clearRect(0,0,W,H);cx.imageSmoothingEnabled=false;cx.drawImage(dc,0,0,W,H);
  cx.globalCompositeOperation="destination-in";cx.drawImage(mk,0,0);cx.globalCompositeOperation="source-over";
  raf=requestAnimationFrame(frame)}
 const pos=e=>{const r=box.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 box.addEventListener("pointermove",e=>{const p=pos(e);ptr.x=p.x;ptr.y=p.y;ptr.in=true;ptr.t=performance.now()});
 box.addEventListener("pointerleave",()=>ptr.in=false);
 box.addEventListener("pointerdown",e=>{const p=pos(e);ptr.x=p.x;ptr.y=p.y;ptr.in=true;ptr.t=performance.now();bursts.push({x:p.x,y:p.y,t:performance.now()});SFX.move()});
 const rs=()=>build();addEventListener("resize",rs);
 build();raf=requestAnimationFrame(frame);
 cleanups.push(()=>{cancelAnimationFrame(raf);removeEventListener("resize",rs)});
}

/* ---------- 3D GLASS AUTO-ROTATING GALLERY + STYLISH FRAME LIGHTBOX ---------- */
function gallery(){
 const ring=$("#ring"),st=$("#stage"),dots=$("#dots");if(!ring||!st)return;
 const cards=[...ring.children],n=cards.length,step=360/n;
 let angle=0,pause=false,dragX=null,moved=false,activeIdx=0,raf,last=performance.now();
 const modal=$("#gmodal"),gmimg=$("#gmimg"),gmcap=$("#gmcap"),gmnum=$("#gmnum");

 const w=()=>parseFloat(getComputedStyle(st).getPropertyValue("--w"));
 const rad=()=>Math.round((w()/2)/Math.tan(Math.PI/n))+38;

 function syncDots(){
  const idx=((Math.round(-angle/step)%n)+n)%n;
  [...dots.children].forEach((d,i)=>d.classList.toggle("on",i===idx));
 }

 function apply(){
  ring.style.transform=`translateZ(-${rad()}px) rotateY(${angle}deg)`;
  syncDots();
 }

 function lay(){
  const r=rad();
  cards.forEach((c,i)=>c.style.transform=`rotateY(${i*step}deg) translateZ(${r}px)`);
  apply();
 }

 dots.innerHTML=cards.map((_,i)=>`<button aria-label="Image ${i+1}"></button>`).join("");
 [...dots.children].forEach((d,i)=>d.onclick=()=>{angle=-i*step;apply()});
 $("#next").onclick=()=>{angle-=step;apply()};
 $("#prev").onclick=()=>{angle+=step;apply()};

 st.onmouseenter=()=>pause=true;
 st.onmouseleave=()=>{if(!modal.classList.contains("open"))pause=false};

 st.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  dragX=e.clientX;
  moved=false;
  pause=true;
 });
 window.addEventListener("pointermove",e=>{
  if(dragX===null)return;
  const dx=e.clientX-dragX;
  if(Math.abs(dx)>5)moved=true;
  angle+=dx*0.35;
  dragX=e.clientX;
  apply();
 });
 window.addEventListener("pointerup",()=>{
  if(dragX!==null){
   dragX=null;
   if(!st.matches(":hover")&&!modal.classList.contains("open"))pause=false;
  }
 });

 function openFrame(i){
  activeIdx=((i%n)+n)%n;
  const item=GAL[activeIdx];
  gmimg.src=U(IM[item[0]],1200);
  gmimg.alt=item[1];
  gmcap.textContent=item[1];
  gmnum.textContent=`PHOTO ${String(activeIdx+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`;
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  pause=true;
 }

 function closeFrame(){
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  if(!st.matches(":hover"))pause=false;
 }

 cards.forEach((c,i)=>{
  c.addEventListener("click",()=>{if(!moved)openFrame(i)});
  c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openFrame(i)}});
 });

 $("#gclose").onclick=closeFrame;
 $("#gmprev").onclick=()=>openFrame(activeIdx-1);
 $("#gmnext").onclick=()=>openFrame(activeIdx+1);
 modal.addEventListener("click",e=>{if(e.target===modal)closeFrame()});

 const onKey=e=>{
  if(!modal.classList.contains("open"))return;
  if(e.key==="Escape")closeFrame();
  if(e.key==="ArrowLeft")openFrame(activeIdx-1);
  if(e.key==="ArrowRight")openFrame(activeIdx+1);
 };
 document.addEventListener("keydown",onKey);

 function tick(now){
  const dt=Math.min((now-last)/1000,.1);
  last=now;
  if(!pause&&dragX===null&&!RM){
   angle-=dt*16;
   apply();
  }
  raf=requestAnimationFrame(tick);
 }

 lay();
 raf=requestAnimationFrame(tick);
 addEventListener("resize",lay);
 cleanups.push(()=>{
  cancelAnimationFrame(raf);
  removeEventListener("resize",lay);
  document.removeEventListener("keydown",onKey);
 });
}
